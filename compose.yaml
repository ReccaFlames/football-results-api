# Rotated JSON-file logs for long-running services (30 MB per container at most).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-football}
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-football}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-football} -d ${POSTGRES_DB:-football}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      FOOTBALL_RESULTS_DATABASE_URL: postgresql+psycopg_async://${POSTGRES_USER:-football}:${POSTGRES_PASSWORD:-football}@db:5432/${POSTGRES_DB:-football}
      FOOTBALL_RESULTS_CONFIG_FILE: ${FOOTBALL_RESULTS_CONFIG_FILE:-/app/config/competitions.yaml}
      FOOTBALL_RESULTS_USER_AGENT: ${FOOTBALL_RESULTS_USER_AGENT:-}
      FOOTBALL_RESULTS_API_KEYS: ${FOOTBALL_RESULTS_API_KEYS:-}
      FOOTBALL_RESULTS_API_KEYS_FILE: ${FOOTBALL_RESULTS_API_KEYS_FILE:-}
      FOOTBALL_RESULTS_FOOTBALL_DATA_API_TOKEN: ${FOOTBALL_RESULTS_FOOTBALL_DATA_API_TOKEN:-}
      FOOTBALL_RESULTS_FOOTBALL_DATA_MIN_REQUEST_INTERVAL_SECONDS: ${FOOTBALL_RESULTS_FOOTBALL_DATA_MIN_REQUEST_INTERVAL_SECONDS:-}
      FOOTBALL_RESULTS_ESPN_MIN_REQUEST_INTERVAL_SECONDS: ${FOOTBALL_RESULTS_ESPN_MIN_REQUEST_INTERVAL_SECONDS:-}
      FOOTBALL_RESULTS_THESPORTSDB_API_KEY: ${FOOTBALL_RESULTS_THESPORTSDB_API_KEY:-}
      FOOTBALL_RESULTS_THESPORTSDB_MIN_REQUEST_INTERVAL_SECONDS: ${FOOTBALL_RESULTS_THESPORTSDB_MIN_REQUEST_INTERVAL_SECONDS:-}
      FOOTBALL_RESULTS_OPENLIGADB_MIN_REQUEST_INTERVAL_SECONDS: ${FOOTBALL_RESULTS_OPENLIGADB_MIN_REQUEST_INTERVAL_SECONDS:-}
      FOOTBALL_RESULTS_RATE_LIMIT_ENABLED: ${FOOTBALL_RESULTS_RATE_LIMIT_ENABLED:-}
      FOOTBALL_RESULTS_RATE_LIMIT_READ_PER_MINUTE: ${FOOTBALL_RESULTS_RATE_LIMIT_READ_PER_MINUTE:-}
      FOOTBALL_RESULTS_RATE_LIMIT_WRITE_PER_MINUTE: ${FOOTBALL_RESULTS_RATE_LIMIT_WRITE_PER_MINUTE:-}
      FOOTBALL_RESULTS_TRUSTED_PROXIES: ${FOOTBALL_RESULTS_TRUSTED_PROXIES:-}
      FOOTBALL_RESULTS_CACHE_MAX_AGE_SECONDS: ${FOOTBALL_RESULTS_CACHE_MAX_AGE_SECONDS:-}
      FOOTBALL_RESULTS_PUBLIC_BASE_URL: ${FOOTBALL_RESULTS_PUBLIC_BASE_URL:-}
      FOOTBALL_RESULTS_LOG_FORMAT: ${FOOTBALL_RESULTS_LOG_FORMAT:-json}
      # Optional OAuth for /mcp (ADR 0006); off while the issuer is empty.
      FOOTBALL_RESULTS_OAUTH_ISSUER: ${FOOTBALL_RESULTS_OAUTH_ISSUER:-}
      FOOTBALL_RESULTS_OAUTH_AUDIENCE: ${FOOTBALL_RESULTS_OAUTH_AUDIENCE:-}
      FOOTBALL_RESULTS_OAUTH_MODE: ${FOOTBALL_RESULTS_OAUTH_MODE:-optional}
      FOOTBALL_RESULTS_OAUTH_SCOPES: ${FOOTBALL_RESULTS_OAUTH_SCOPES:-}
      FOOTBALL_RESULTS_OAUTH_JWKS_URL: ${FOOTBALL_RESULTS_OAUTH_JWKS_URL:-}
    volumes:
      - ./config/competitions.yaml:/app/config/competitions.yaml:ro
      # Optional keys file: FOOTBALL_RESULTS_API_KEYS_FILE=/app/secrets/api-keys.yaml
      - ./secrets:/app/secrets:ro
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"

  scheduler:
    build: .
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    entrypoint: ["python", "-m", "app.scheduler"]
    environment:
      FOOTBALL_RESULTS_DATABASE_URL: postgresql+psycopg_async://${POSTGRES_USER:-football}:${POSTGRES_PASSWORD:-football}@db:5432/${POSTGRES_DB:-football}
      FOOTBALL_RESULTS_CONFIG_FILE: ${FOOTBALL_RESULTS_CONFIG_FILE:-/app/config/competitions.yaml}
      FOOTBALL_RESULTS_USER_AGENT: ${FOOTBALL_RESULTS_USER_AGENT:-}
      FOOTBALL_RESULTS_SCHEDULER_LOOP_SECONDS: ${FOOTBALL_RESULTS_SCHEDULER_LOOP_SECONDS:-30}
      FOOTBALL_RESULTS_SCHEDULER_CLAIM_LIMIT: ${FOOTBALL_RESULTS_SCHEDULER_CLAIM_LIMIT:-5}
      FOOTBALL_RESULTS_SCHEDULER_WORKER_TIMEOUT_SECONDS: ${FOOTBALL_RESULTS_SCHEDULER_WORKER_TIMEOUT_SECONDS:-300}
      FOOTBALL_RESULTS_FOOTBALL_DATA_API_TOKEN: ${FOOTBALL_RESULTS_FOOTBALL_DATA_API_TOKEN:-}
      FOOTBALL_RESULTS_FOOTBALL_DATA_MIN_REQUEST_INTERVAL_SECONDS: ${FOOTBALL_RESULTS_FOOTBALL_DATA_MIN_REQUEST_INTERVAL_SECONDS:-}
      FOOTBALL_RESULTS_ESPN_MIN_REQUEST_INTERVAL_SECONDS: ${FOOTBALL_RESULTS_ESPN_MIN_REQUEST_INTERVAL_SECONDS:-}
      FOOTBALL_RESULTS_THESPORTSDB_API_KEY: ${FOOTBALL_RESULTS_THESPORTSDB_API_KEY:-}
      FOOTBALL_RESULTS_THESPORTSDB_MIN_REQUEST_INTERVAL_SECONDS: ${FOOTBALL_RESULTS_THESPORTSDB_MIN_REQUEST_INTERVAL_SECONDS:-}
      FOOTBALL_RESULTS_OPENLIGADB_MIN_REQUEST_INTERVAL_SECONDS: ${FOOTBALL_RESULTS_OPENLIGADB_MIN_REQUEST_INTERVAL_SECONDS:-}
      FOOTBALL_RESULTS_NINETY_MINUT_MIN_REQUEST_INTERVAL_SECONDS: ${FOOTBALL_RESULTS_NINETY_MINUT_MIN_REQUEST_INTERVAL_SECONDS:-}
      FOOTBALL_RESULTS_LOG_FORMAT: ${FOOTBALL_RESULTS_LOG_FORMAT:-json}
    volumes:
      - ./config/competitions.yaml:/app/config/competitions.yaml:ro

  # Monitoring: docker compose --profile observability up -d (see README, Observability).
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    secrets:
      - prometheus_api_key
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:13.0.2
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    configs:
      - source: grafana_contact_points
        target: /etc/grafana/provisioning/alerting/contact-points.yaml
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/provisioning/alerting/rules.yaml:/etc/grafana/provisioning/alerting/rules.yaml:ro
      - ./observability/grafana/provisioning/alerting/policies.yaml:/etc/grafana/provisioning/alerting/policies.yaml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  # Disposable database for integration tests: docker compose --profile test up -d test-db
  # Example authorization server for OAuth on /mcp (README "OAuth for the MCP server").
  # Development mode on plain HTTP; not for production. No users ship with the realm.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: ["oauth-example"]
    restart: unless-stopped
    logging: *logging
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: football_test
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_test"]
      interval: 2s
      timeout: 5s
      retries: 15

# Rendered by Compose rather than by Grafana: Grafana turns environment values that look like
# numbers (Telegram chat IDs) into numbers, which the Telegram contact point rejects.
configs:
  grafana_contact_points:
    content: |
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: telegram
          receivers:
            - uid: football-results-telegram
              type: telegram
              disableResolveMessage: false
              settings:
                bottoken: "${TELEGRAM_BOT_TOKEN:-not-configured}"
                chatid: "${TELEGRAM_CHAT_ID:-not-configured}"
                parse_mode: HTML

secrets:
  prometheus_api_key:
    environment: PROMETHEUS_API_KEY

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
