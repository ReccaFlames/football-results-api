# Public, read-only demo instance (ADR 0007). Deployment guide: docs/DEMO.md.
#   docker compose -f compose.yaml -f compose.demo.yaml up -d --build
# Serves only config/demo-competitions.yaml (redistributable providers), has no admin keys (so
# writes, jobs, admin operations, and /metrics return writes-disabled), and gives anonymous
# clients a low read quota. Do not use the observability profile here: Prometheus needs an admin
# key. Client keys in FOOTBALL_RESULTS_API_KEYS_FILE stay allowed.
# Container logs go to journald, which deletes them by age (docs/DEMO.md, section 2); keep its
# MaxRetentionSec equal to FOOTBALL_RESULTS_LOG_RETENTION_DAYS, which /privacy states.
# The API and landing ports are bound to 127.0.0.1 whatever API_BIND_ADDRESS and
# WEB_BIND_ADDRESS say: only Caddy on the host may reach them, because Docker-published ports
# bypass the host firewall. POSTGRES_PASSWORD has no
# default here, and demo mode refuses a shipped default or short password (use hex: the password
# is part of the database URL).
x-demo-logging: &demo-logging
  driver: journald

x-demo-database-url: &demo-database-url postgresql+psycopg_async://${POSTGRES_USER:-football}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}@db:5432/${POSTGRES_DB:-football}

x-demo-environment: &demo-environment
  FOOTBALL_RESULTS_DEMO_MODE: "true"
  FOOTBALL_RESULTS_DATABASE_URL: *demo-database-url
  FOOTBALL_RESULTS_CONFIG_FILE: /app/config/demo-competitions.yaml
  FOOTBALL_RESULTS_LOG_FORMAT: json
  # Shown on /privacy; demo mode refuses to start without it.
  FOOTBALL_RESULTS_OPERATOR_CONTACT: ${FOOTBALL_RESULTS_OPERATOR_CONTACT:-}
  FOOTBALL_RESULTS_LOG_RETENTION_DAYS: ${FOOTBALL_RESULTS_LOG_RETENTION_DAYS:-14}

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}

  api:
    ports: !override
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      <<: *demo-environment
      # Overrides any admin keys from .env; demo mode would refuse to start with them.
      FOOTBALL_RESULTS_API_KEYS: ""
      FOOTBALL_RESULTS_RATE_LIMIT_ENABLED: "true"
      FOOTBALL_RESULTS_RATE_LIMIT_READ_PER_MINUTE: ${DEMO_READ_PER_MINUTE:-30}
      FOOTBALL_RESULTS_RATE_LIMIT_WRITE_PER_MINUTE: "5"
    logging: *demo-logging
    volumes:
      - ./config/demo-competitions.yaml:/app/config/demo-competitions.yaml:ro

  scheduler:
    environment:
      <<: *demo-environment
      FOOTBALL_RESULTS_API_KEYS: ""
    logging: *demo-logging
    volumes:
      - ./config/demo-competitions.yaml:/app/config/demo-competitions.yaml:ro

  # Reads demo mode from the API's /llms.txt and shows "no key needed" instead of the form.
  web:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8001}:8001"
    logging: *demo-logging
