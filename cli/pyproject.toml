[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "football-results-cli"
version = "0.19.0"
description = "Command-line client for the Football Results API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "typer>=0.29,<1",
]

[project.scripts]
football-results = "football_results_cli.main:main"

[tool.setuptools.packages.find]
include = ["football_results_cli*"]
