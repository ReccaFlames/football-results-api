[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "football-results-cli"
version = "0.26.0"
description = "Command-line client for the Football Results API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ReccaFlames" }]
keywords = ["football", "soccer", "results", "standings", "cli", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "typer>=0.29,<1",
]

[project.urls]
Homepage = "https://github.com/ReccaFlames/football-results-api"
Repository = "https://github.com/ReccaFlames/football-results-api"
Issues = "https://github.com/ReccaFlames/football-results-api/issues"
Changelog = "https://github.com/ReccaFlames/football-results-api/releases"

[project.scripts]
football-results = "football_results_cli.main:main"

[tool.setuptools.packages.find]
include = ["football_results_cli*"]
