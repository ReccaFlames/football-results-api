[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "football-results-api"
version = "0.27.0"
description = "Cached multi-competition REST API for football match results"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.116,<1",
  "httpx[socks]>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0,<2.2",
  "uvicorn[standard]>=0.35,<1",
  "mcp>=2.3,<3",
  "prometheus-client>=0.21,<1",
  "pyjwt[crypto]>=2.10",
]
[project.urls]
Homepage = "https://github.com/ReccaFlames/football-results-api"
Repository = "https://github.com/ReccaFlames/football-results-api"
Issues = "https://github.com/ReccaFlames/football-results-api/issues"
Changelog = "https://github.com/ReccaFlames/football-results-api/releases"

[project.optional-dependencies]
dev = [
  "football-results-cli",
  "football-results-web",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.uv.workspace]
members = ["cli", "web"]

[tool.uv.sources]
football-results-cli = { workspace = true }
football-results-web = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
