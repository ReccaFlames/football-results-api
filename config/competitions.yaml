  - slug: premier-league
    name: Premier League
    country: England
    format: league
    provider: espn
    # football-data.org fills in fixtures, status, kickoff times, and scores while ESPN fails;
    # it needs FOOTBALL_RESULTS_FOOTBALL_DATA_API_TOKEN. See docs/adr/0002-fallback-source-refreshes.md.
    fallback_provider: football-data
