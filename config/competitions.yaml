        source_url: http://www.90minut.pl/liga/1/liga14681.html

  # ESPN's undocumented scoreboard API (personal, non-commercial use); see
  # docs/adr/0001-espn-primary-source-for-premier-league.md.
  - slug: premier-league
    name: Premier League
    country: England
