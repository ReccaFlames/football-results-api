defaults:
  schedule:
    policy: adaptive
    pre_match_check_minutes: 30
    match_duration_minutes:
      league: 105
      cup: 135
    # Poll every 5 min while a result is up to 30 min late, every 15 min up to 4 h, then hourly.
    result_poll_minutes: [5, 15, 60]
    result_poll_until_minutes: [30, 240]
    idle_interval: 1d
    off_season_interval: 7d   # used when the next fixture is more than off_season_after away
    off_season_after: 30d
    failure_backoff_minutes: [5, 15, 30, 60]
    # auto: discover new seasons and roll current_season forward once the current season is
    # finished; current_season below then acts as a minimum. manual: current_season is exact.
    season_rollover: auto
    season_check_interval: 1d

providers:
  90minut:
    min_request_interval_seconds: 2
  football-data:
    min_request_interval_seconds: 6
  espn:
    min_request_interval_seconds: 2

competitions:
  - slug: ekstraklasa
    name: PKO BP Ekstraklasa
    country: Poland
    format: league
    provider: 90minut
    current_season: 2026-2027
    seasons:
      "2025-2026":
        source_url: http://www.90minut.pl/liga/1/liga14072.html
      "2026-2027":
        source_url: http://www.90minut.pl/liga/1/liga14675.html

  - slug: pierwsza-liga
    name: Betclic I liga
    country: Poland
    format: league
    provider: 90minut
    current_season: 2026-2027
