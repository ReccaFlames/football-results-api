defaults:
  schedule:
    policy: adaptive
    pre_match_check_minutes: 30
    match_duration_minutes:
      league: 105
      cup: 135
    # Poll every 5 min while a result is up to 30 min late, every 15 min up to 4 h, then hourly.
    result_poll_minutes: [5, 15, 60]
    result_poll_until_minutes: [30, 240]
    idle_interval: 1d
    off_season_interval: 7d   # used when the next fixture is more than off_season_after away
    off_season_after: 30d
    failure_backoff_minutes: [5, 15, 30, 60]
    # auto: discover new seasons and roll current_season forward once the current season is
    # finished; current_season below then acts as a minimum. manual: current_season is exact.
    season_rollover: auto
    season_check_interval: 1d
    # After this many primary source failures in a row, each scheduled check of a current season
    # falls back to the competition's fallback source (if any) for that one refresh.
    fallback_after_failures: 3

providers:
  90minut:
    min_request_interval_seconds: 2
  football-data:
    min_request_interval_seconds: 6
  espn:
    min_request_interval_seconds: 2
  # Windowed source (ADR 0003): fallback_provider only. Free plan: 30 requests per minute.
  thesportsdb:
    min_request_interval_seconds: 3
    window_days_back: 7
    window_days_ahead: 14

competitions:
  - slug: ekstraklasa
    name: PKO BP Ekstraklasa
    country: Poland
    format: league
    provider: 90minut
    current_season: 2026-2027
    seasons:
      "2025-2026":
        source_url: http://www.90minut.pl/liga/1/liga14072.html
      "2026-2027":
        source_url: http://www.90minut.pl/liga/1/liga14675.html

  - slug: pierwsza-liga
    name: Betclic I liga
    country: Poland
    format: league
    provider: 90minut
    current_season: 2026-2027
    seasons:
      "2025-2026":
        source_url: http://www.90minut.pl/liga/1/liga14073.html
      "2026-2027":
        source_url: http://www.90minut.pl/liga/1/liga14676.html

  - slug: europa-league
    name: UEFA Europa League
    format: cup
    provider: 90minut
    # ESPN fills in fixtures, status, kickoff times, and scores while 90minut fails.
    # See docs/adr/0002-fallback-source-refreshes.md.
    fallback_provider: espn
    current_season: 2026-2027
    seasons:
      "2025-2026":
        source_url: http://www.90minut.pl/liga/1/liga14078.html
      "2026-2027":
        source_url: http://www.90minut.pl/liga/1/liga14681.html
        fallback_url: https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa/scoreboard?season=2026
    # ESPN team name -> the 90minut team name, for the 2026-27 league-phase teams. Teams whose
    # names are equal (AC Milan, AFC Bournemouth, NK Celje, SK Sturm Graz) need no alias.
    team_aliases:
      AZ Alkmaar: AZ (Alkmaar)
      Anderlecht: RSC Anderlecht
