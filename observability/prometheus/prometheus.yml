# Scrapes the API's /metrics. The API key comes from the compose secret prometheus_api_key
# (PROMETHEUS_API_KEY, one of FOOTBALL_RESULTS_API_KEYS).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: football-results-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prometheus_api_key
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
