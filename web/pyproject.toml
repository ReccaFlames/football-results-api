[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "football-results-web"
version = "0.27.0"
description = "Landing page for the Football Results API"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ReccaFlames" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "markupsafe>=2.1,<4",
    "python-multipart>=0.0.20,<1",
    "starlette>=1,<2",
    "uvicorn>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/ReccaFlames/football-results-api"
Repository = "https://github.com/ReccaFlames/football-results-api"
Issues = "https://github.com/ReccaFlames/football-results-api/issues"

[tool.setuptools.packages.find]
include = ["football_results_web*"]

[tool.setuptools.package-data]
football_results_web = ["templates/*", "static/*", "static/flags/*"]
